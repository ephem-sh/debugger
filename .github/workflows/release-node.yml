name: Release Node
on:
  workflow_dispatch:
  push:
    branches: [develop]

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should-publish: ${{ steps.check.outputs.publish }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: check
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "publish=true" >> $GITHUB_OUTPUT
            VERSION=$(node -e "console.log(require('./packages/debugger/package.json').version)")
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          else
            MSG=$(git log -1 --pretty=%s)
            if [[ "$MSG" =~ ^release\(node\):\ v(.+)$ ]]; then
              echo "publish=true" >> $GITHUB_OUTPUT
              echo "version=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
            else
              echo "publish=false" >> $GITHUB_OUTPUT
            fi
          fi

  publish:
    needs: check
    if: needs.check.outputs.should-publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: bun install
      - run: bun run build
      - run: npm install -g npm@latest
      - run: cd packages/debugger && npm publish --provenance --access public
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debugger-v${{ needs.check.outputs.version }}
          generate_release_notes: true
