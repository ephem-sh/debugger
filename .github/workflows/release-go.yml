name: Release Go
on:
  workflow_dispatch:
  push:
    tags:
      - 'debugger-go-v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Verify build
        run: cd packages/debugger-go && go build ./...
      - name: Create Go module tag
        run: |
          VERSION="${GITHUB_REF_NAME#debugger-go-v}"
          GO_TAG="packages/ephem-debugger-go/v${VERSION}"
          git tag "${GO_TAG}"
          git push origin "${GO_TAG}"
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
