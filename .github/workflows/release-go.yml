name: Release Go
on:
  workflow_dispatch:
  push:
    branches: [develop]

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should-publish: ${{ steps.check.outputs.publish }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: check
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "publish=true" >> $GITHUB_OUTPUT
            echo "version=0.0.0" >> $GITHUB_OUTPUT
            exit 0
          fi
          COMMITS='${{ toJSON(github.event.commits.*.message) }}'
          VERSION=$(echo "$COMMITS" | grep -oP 'release\(go\): v\K[0-9.]+' | tail -1)
          if [[ -n "$VERSION" ]]; then
            echo "publish=true" >> $GITHUB_OUTPUT
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          else
            echo "publish=false" >> $GITHUB_OUTPUT
          fi

  publish:
    needs: check
    if: needs.check.outputs.should-publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Verify build
        run: cd packages/debugger-go && go build ./...
      - name: Create Go module tag
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          GO_TAG="packages/ephem-debugger-go/v${VERSION}"
          git tag "${GO_TAG}"
          git push origin "${GO_TAG}"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debugger-go-v${{ needs.check.outputs.version }}
          generate_release_notes: true
