name: CI
on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run typecheck
      - run: bun run build

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - run: cd packages/debugger-go && go build ./...
      - run: cd packages/debugger-go && go vet ./...

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
      - run: cd packages/debugger-py && uv sync
      - run: cd packages/debugger-py && uv run python -c "from ephem_debugger import Debugger; print('OK')"

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cd packages/debugger-rs && cargo build --all-features
      - run: cd packages/debugger-rs && cargo clippy --all-features -- -D warnings
