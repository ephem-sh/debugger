name: Release Python
on:
  push:
    tags: ['debugger-py-v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
      - run: cd packages/debugger-py && uv build
      - run: cd packages/debugger-py && uv publish --trusted-publishing always
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
