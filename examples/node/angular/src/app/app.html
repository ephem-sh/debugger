<main style="max-width: 640px; margin: 0 auto; padding: 32px 16px; font-family: system-ui, -apple-system, sans-serif;">
  <h1 style="font-size: 20px; font-weight: 600; margin: 0 0 24px;">Angular — Debugger Test</h1>

  <section style="margin-bottom: 24px;">
    <h2 style="font-size: 14px; font-weight: 600; margin: 0 0 8px; color: #6b7280;">Console & Errors</h2>
    <div style="display: flex; flex-wrap: wrap; gap: 6px;">
      <button (click)="onConsoleLog()" style="padding: 8px 16px; font-size: 14px; font-weight: 500; border: 1px solid #e5e7eb; border-radius: 8px; background: none; cursor: pointer;">console.log</button>
      <button (click)="onConsoleWarn()" style="padding: 8px 16px; font-size: 14px; font-weight: 500; border: 1px solid #e5e7eb; border-radius: 8px; background: none; cursor: pointer;">console.warn</button>
      <button (click)="onConsoleError()" style="padding: 8px 16px; font-size: 14px; font-weight: 500; border: 1px solid #e5e7eb; border-radius: 8px; background: none; cursor: pointer;">console.error</button>
      <button (click)="onThrowError()" style="padding: 8px 16px; font-size: 14px; font-weight: 500; border: 1px solid #e5e7eb; border-radius: 8px; background: none; cursor: pointer;">Throw Error</button>
      <button (click)="onUnhandledRejection()" style="padding: 8px 16px; font-size: 14px; font-weight: 500; border: 1px solid #e5e7eb; border-radius: 8px; background: none; cursor: pointer;">Unhandled Rejection</button>
    </div>
  </section>

  <section style="margin-bottom: 24px;">
    <h2 style="font-size: 14px; font-weight: 600; margin: 0 0 8px; color: #6b7280;">Network</h2>
    <div style="display: flex; flex-wrap: wrap; gap: 6px;">
      <button (click)="onFetchSuccess()" style="padding: 8px 16px; font-size: 14px; font-weight: 500; border: 1px solid #e5e7eb; border-radius: 8px; background: none; cursor: pointer;">Fetch Success</button>
      <button (click)="onFetchError()" style="padding: 8px 16px; font-size: 14px; font-weight: 500; border: 1px solid #e5e7eb; border-radius: 8px; background: none; cursor: pointer;">Fetch Error</button>
    </div>
  </section>

  <section>
    <h2 style="font-size: 14px; font-weight: 600; margin: 0 0 8px; color: #6b7280;">Application State</h2>
    <div style="display: flex; flex-wrap: wrap; gap: 6px;">
      <button (click)="onSetCookie()" style="padding: 8px 16px; font-size: 14px; font-weight: 500; border: 1px solid #e5e7eb; border-radius: 8px; background: none; cursor: pointer;">Set Cookie</button>
      <button (click)="onRemoveCookies()" style="padding: 8px 16px; font-size: 14px; font-weight: 500; border: 1px solid #e5e7eb; border-radius: 8px; background: none; cursor: pointer;">Remove Cookies</button>
      <button (click)="onSetLocalStorage()" style="padding: 8px 16px; font-size: 14px; font-weight: 500; border: 1px solid #e5e7eb; border-radius: 8px; background: none; cursor: pointer;">Set localStorage</button>
      <button (click)="onClearLocalStorage()" style="padding: 8px 16px; font-size: 14px; font-weight: 500; border: 1px solid #e5e7eb; border-radius: 8px; background: none; cursor: pointer;">Clear localStorage</button>
      <button (click)="onSetSessionStorage()" style="padding: 8px 16px; font-size: 14px; font-weight: 500; border: 1px solid #e5e7eb; border-radius: 8px; background: none; cursor: pointer;">Set sessionStorage</button>
      <button (click)="onClearSessionStorage()" style="padding: 8px 16px; font-size: 14px; font-weight: 500; border: 1px solid #e5e7eb; border-radius: 8px; background: none; cursor: pointer;">Clear sessionStorage</button>
      <button (click)="onFillAll()" style="padding: 8px 16px; font-size: 14px; font-weight: 500; border: 1px solid #e5e7eb; border-radius: 8px; background: none; cursor: pointer;">Fill All</button>
      <button (click)="onClearAll()" style="padding: 8px 16px; font-size: 14px; font-weight: 500; border: 1px solid #e5e7eb; border-radius: 8px; background: none; cursor: pointer;">Clear All</button>
    </div>
  </section>
</main>
